<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Pizzas | Bella Napoli</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="fa-solid fa-pizza-slice text-warning me-2"></i>Bella Napoli
        </a>
        <div class="d-flex gap-2">
          <a href="index.html" class="btn btn-outline-light btn-sm">
            <i class="fa-solid fa-arrow-left me-1"></i> Voltar ao cardápio
          </a>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
              <h1 class="h2 fw-bold mb-4">Cadastro de Pizza</h1>

              <form id="pizza-form">
                <div class="mb-3">
                  <label for="nome" class="form-label">Nome da pizza</label>
                  <input
                    id="nome"
                    name="nome"
                    type="text"
                    class="form-control"
                    placeholder="Ex.: Pepperoni"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="descricao" class="form-label">Descrição</label>
                  <textarea
                    id="descricao"
                    name="descricao"
                    class="form-control"
                    rows="4"
                    placeholder="Descreva os ingredientes e o sabor da pizza"
                    required
                  ></textarea>
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="preco" class="form-label">Preço</label>
                    <input
                      id="preco"
                      name="preco"
                      type="number"
                      min="1"
                      step="0.01"
                      class="form-control"
                      placeholder="45.90"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="imagem" class="form-label">Imagem (URL)</label>
                    <input
                      id="imagem"
                      name="imagem"
                      type="url"
                      class="form-control"
                      placeholder="https://..."
                    />
                  </div>
                </div>

                <div class="form-check form-switch mt-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    role="switch"
                    id="disponivel"
                    name="disponivel"
                    checked
                  />
                  <label class="form-check-label" for="disponivel">
                    Disponível para venda
                  </label>
                </div>

                <div id="form-feedback" class="mt-3" aria-live="polite"></div>

                <div class="d-flex gap-2 mt-4">
                  <button type="submit" class="btn btn-success px-4">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Salvar pizza
                  </button>
                  <a href="index.html" class="btn btn-outline-secondary">
                    Cancelar
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/script.js"></script>
  </body>
</html>
